name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build LlmChamber
        run: |
          dotnet restore src/LlmChamber/LlmChamber.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/LlmChamber/LlmChamber.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build LlmChamber.Wpf
        run: |
          dotnet restore src/LlmChamber.Wpf/LlmChamber.Wpf.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/LlmChamber.Wpf/LlmChamber.Wpf.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build LlmChamber.Avalonia
        run: |
          dotnet restore src/LlmChamber.Avalonia/LlmChamber.Avalonia.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/LlmChamber.Avalonia/LlmChamber.Avalonia.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build LlmChamber.WinForms
        run: |
          dotnet restore src/LlmChamber.WinForms/LlmChamber.WinForms.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/LlmChamber.WinForms/LlmChamber.WinForms.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet run --project test/LlmChamber.Tests/LlmChamber.Tests.csproj -c Release --framework net8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project test/LlmChamber.Tests/LlmChamber.Tests.csproj -c Release --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build LlmChamber.SuperResolution
        run: |
          dotnet build src/LlmChamber.SuperResolution/LlmChamber.SuperResolution.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run SuperResolution regression tests
        run: |
          dotnet run --project test/LlmChamber.SuperResolution.Tests/LlmChamber.SuperResolution.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
