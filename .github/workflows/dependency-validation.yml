name: Dependency validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
      - name: Restore NuGet package cache
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-
            ${{ runner.os }}-nuget-
      # 検証対象(公開4パッケージ・SuperResolution・2つのテスト)を solution filter で1回だけ restore / build する。
      # 以降のテストは同じ出力を --no-build で使い、再ビルドしない。
      - name: Restore
        run: |
          dotnet restore .github/LlmChamber.ci.slnf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save NuGet package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
      - name: Build
        run: |
          dotnet build .github/LlmChamber.ci.slnf -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet run --no-build --project test/LlmChamber.Tests/LlmChamber.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run SuperResolution regression tests
        run: |
          dotnet run --no-build --project test/LlmChamber.SuperResolution.Tests/LlmChamber.SuperResolution.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
