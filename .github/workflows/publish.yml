name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build src projects
        run: |
          dotnet build src/LlmChamber/LlmChamber.csproj -c Release
          dotnet build src/LlmChamber.Wpf/LlmChamber.Wpf.csproj -c Release
          dotnet build src/LlmChamber.Avalonia/LlmChamber.Avalonia.csproj -c Release
          dotnet build src/LlmChamber.WinForms/LlmChamber.WinForms.csproj -c Release

      - name: Pack LlmChamber
        run: dotnet pack src/LlmChamber/LlmChamber.csproj -c Release --no-build -o artifacts

      - name: Pack LlmChamber.Wpf
        run: dotnet pack src/LlmChamber.Wpf/LlmChamber.Wpf.csproj -c Release --no-build -o artifacts

      - name: Pack LlmChamber.Avalonia
        run: dotnet pack src/LlmChamber.Avalonia/LlmChamber.Avalonia.csproj -c Release --no-build -o artifacts

      - name: Pack LlmChamber.WinForms
        run: dotnet pack src/LlmChamber.WinForms/LlmChamber.WinForms.csproj -c Release --no-build -o artifacts

      - name: Verify release packages
        shell: pwsh
        run: ./.github/scripts/Verify-Packages.ps1

      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packageIds = @(
            'LlmChamber',
            'LlmChamber.Wpf',
            'LlmChamber.Avalonia',
            'LlmChamber.WinForms'
          )
          $packages = foreach ($packageId in $packageIds) {
            $pattern = '^' + [regex]::Escape($packageId) + '\.\d.*\.nupkg$'
            $matches = @(
              Get-ChildItem -Path artifacts -Filter '*.nupkg' -File |
                Where-Object Name -Match $pattern
            )
            if ($matches.Count -ne 1) {
              Write-Error "Expected exactly one package for '$packageId', found $($matches.Count)."
              exit 1
            }
            $matches[0]
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh
